[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge-cli"
version = "0.1.0"
description = "Command line client for TicketForge"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ticketforge = "ticketforge.cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]
